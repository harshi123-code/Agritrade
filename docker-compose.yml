services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agritrade
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - agritrade-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/agritrade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}
      MONGO_URL: ${MONGO_URL:-mongodb://localhost:27017/agritrade}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-ollama}
      APP_AI_MODEL: ${APP_AI_MODEL:-llama3.2:1b}
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

