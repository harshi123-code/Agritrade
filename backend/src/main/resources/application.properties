spring.application.name=AgriTrade
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agritrade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/agritrade}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.ai.api-key=${APP_AI_API_KEY:ollama}
app.ai.model=${APP_AI_MODEL:llama3.2:1b}
app.ai.base-url=${APP_AI_BASE_URL:http://localhost:11434/v1}
# Local development fallback; set APP_JWT_SECRET to a private Base64 key outside development.
app.jwt.secret=${APP_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
