databases:
  - name: agritrade-neela-db
    databaseName: agritrade
    user: agritrade
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: agritrade-neela-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: agritrade-neela-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agritrade-neela-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: agritrade-neela-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: agritrade-neela-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agritrade-neela-db
          property: password
      - key: DB_POOL_INIT_FAIL_TIMEOUT_MS
        value: "120000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.netlify.app"
      - key: APP_AI_API_KEY
        sync: false
      - key: APP_AI_MODEL
        sync: false
      - key: APP_AI_BASE_URL
        sync: false
